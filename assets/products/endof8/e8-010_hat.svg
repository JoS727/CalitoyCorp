<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="fabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#151515;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="15" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="600" height="600" fill="#f5f5f5"/>
  
  <!-- Hat crown -->
  <ellipse cx="300" cy="250" rx="120" ry="100" fill="url(#fabric)" filter="url(#shadow)"/>
  
  <!-- Hat brim -->
  <path d="M180 280 Q300 320 420 280 L440 300 Q300 350 160 300 Z" fill="url(#fabric)"/>
  
  <!-- Design -->
  <g transform="translate(300, 250)">
    <text x="0" y="10" text-anchor="middle" fill="#D2691E" font-size="50" font-family="serif">🌊</text>
    <text x="0" y="50" text-anchor="middle" fill="#D2691E" font-size="12" font-family="sans-serif" letter-spacing="2">ENDOF8</text>
  </g>
  
  <text x="300" y="560" text-anchor="middle" fill="#666" font-size="14" font-family="sans-serif">Dog Beach Hat</text>
</svg>