<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="fabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="600" fill="#f5f5f5"/>
  
  <!-- T-shirt shape -->
  <path d="M200 80 
           Q240 80 250 120 
           L280 120 
           L320 120 
           Q330 80 370 80 
           L420 150 
           L400 170 
           L380 160 
           L380 500 
           Q300 520 220 500 
           L220 160 
           L200 170 
           L180 150 
           Z" 
        fill="url(#fabric)" 
        filter="url(#shadow)"/>
  
  <!-- Neck line -->
  <path d="M250 120 Q300 160 320 120" fill="none" stroke="#2a2a2a" stroke-width="3"/>
  
  <!-- Design -->
  <g transform="translate(300, 280)" filter="url(#glow)">
    <text x="0" y="0" text-anchor="middle" fill="#C9A227" font-size="80" font-family="serif" font-weight="bold">🌙</text>
    <text x="0" y="50" text-anchor="middle" fill="#C9A227" font-size="16" font-family="sans-serif" letter-spacing="4">TAROSYN</text>
  </g>
  
  <!-- Product label -->
  <text x="300" y="560" text-anchor="middle" fill="#666" font-size="14" font-family="sans-serif">Tarosyn Cosmic Crest</text>
</svg>