<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kurced | Official Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple: #6B2C91;
      --purple-light: #9B59B6;
      --purple-dark: #4A1A6B;
      --neon: #FF00FF;
      --black: #0A0A0A;
      --white: #FFFFFF;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: var(--black);
      color: var(--white);
      line-height: 1.6;
    }
    
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: rgba(10,10,10,0.98);
      backdrop-filter: blur(20px);
      z-index: 1000;
      border-bottom: 1px solid rgba(107,44,145,0.3);
    }
    
    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    
    .logo-crest {
      width: 50px;
      height: 50px;
      border: 2px solid var(--neon);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, rgba(255,0,255,0.1) 0%, transparent 70%);
      box-shadow: 0 0 20px rgba(255,0,255,0.3);
    }
    
    .logo-text {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--neon);
      letter-spacing: 4px;
      text-shadow: 0 0 10px rgba(255,0,255,0.5);
    }
    
    .nav {
      display: flex;
      gap: 2.5rem;
    }
    
    .nav a {
      color: var(--white);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 400;
      letter-spacing: 2px;
      transition: all 0.3s;
      position: relative;
    }
    
    .nav a:hover { 
      color: var(--neon);
      text-shadow: 0 0 10px rgba(255,0,255,0.5);
    }
    
    .cart-btn {
      background: transparent;
      border: 1px solid var(--neon);
      color: var(--neon);
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 500;
      letter-spacing: 2px;
      transition: all 0.3s;
      box-shadow: 0 0 10px rgba(255,0,255,0.2);
    }
    
    .cart-btn:hover {
      background: var(--neon);
      color: var(--black);
      box-shadow: 0 0 20px rgba(255,0,255,0.5);
    }
    
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8rem 2rem 4rem;
      background: linear-gradient(180deg, var(--black) 0%, #0f0f0f 50%, var(--black) 100%);
      position: relative;
      overflow: hidden;
    }
    
    .hero::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(107,44,145,0.15) 0%, transparent 60%);
      pointer-events: none;
    }
    
    .hero::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 30%, rgba(255,0,255,0.05) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(107,44,145,0.1) 0%, transparent 40%);
      pointer-events: none;
    }
    
    .hero-crest {
      width: 300px;
      height: 300px;
      margin-bottom: 2rem;
      position: relative;
      filter: drop-shadow(0 0 30px rgba(255,0,255,0.3));
    }
    
    .hero h1 {
      font-family: 'Cinzel', serif;
      font-size: 4rem;
      font-weight: 600;
      letter-spacing: 8px;
      margin-bottom: 1rem;
      color: var(--neon);
      text-shadow: 0 0 20px rgba(255,0,255,0.5);
    }
    
    .hero-tagline {
      font-size: 1rem;
      color: rgba(255,255,255,0.7);
      margin-bottom: 3rem;
      max-width: 500px;
      font-weight: 300;
      letter-spacing: 2px;
    }
    
    .pillars {
      display: flex;
      justify-content: center;
      gap: 2.5rem;
      margin-bottom: 4rem;
    }
    
    .pillar {
      text-align: center;
      padding: 1rem;
      border: 1px solid rgba(255,0,255,0.2);
      border-radius: 8px;
      background: rgba(107,44,145,0.1);
    }
    
    .pillar-text {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--neon);
      font-weight: 500;
    }
    
    .cta-btn {
      display: inline-block;
      background: transparent;
      color: var(--neon);
      padding: 1.25rem 3rem;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 3px;
      text-decoration: none;
      border-radius: 4px;
      transition: all 0.3s;
      border: 2px solid var(--neon);
      box-shadow: 0 0 20px rgba(255,0,255,0.3), inset 0 0 20px rgba(255,0,255,0.1);
    }
    
    .cta-btn:hover {
      background: var(--neon);
      color: var(--black);
      box-shadow: 0 0 40px rgba(255,0,255,0.5);
    }
    
    .products {
      padding: 6rem 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    
    .section-header {
      text-align: center;
      margin-bottom: 4rem;
    }
    
    .section-header h2 {
      font-family: 'Cinzel', serif;
      font-size: 2.5rem;
      color: var(--neon);
      margin-bottom: 1rem;
      letter-spacing: 6px;
      text-shadow: 0 0 10px rgba(255,0,255,0.3);
    }
    
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2.5rem;
    }
    
    .product-card {
      background: #0f0f0f;
      border: 1px solid rgba(107,44,145,0.2);
      border-radius: 8px;
      overflow: hidden;
      transition: all 0.4s ease;
    }
    
    .product-card:hover {
      border-color: var(--neon);
      box-shadow: 0 0 30px rgba(255,0,255,0.2);
      transform: translateY(-5px);
    }
    
    .product-image {
      aspect-ratio: 1;
      background: linear-gradient(135deg, #0f0f0f 0%, #1a0a1a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    
    .product-price {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--neon);
      margin-bottom: 1rem;
      text-shadow: 0 0 10px rgba(255,0,255,0.3);
    }
    
    .add-to-cart {
      width: 100%;
      background: transparent;
      color: var(--neon);
      border: 1px solid var(--neon);
      padding: 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 2px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.3s;
      box-shadow: 0 0 10px rgba(255,0,255,0.2);
    }
    
    .add-to-cart:hover {
      background: var(--neon);
      color: var(--black);
      box-shadow: 0 0 20px rgba(255,0,255,0.4);
    }
    
    @media (max-width: 768px) {
      .hero h1 { font-size: 2.5rem; }
      .hero-crest { width: 220px; height: 220px; }
      .pillars { flex-direction: column; gap: 1rem; }
      .nav { display: none; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-content">
      <div class="logo">
        <div class="logo-crest">
          <!-- Kurced Crest SVG -->
          <svg viewBox="0 0 100 100" width="40" height="40">
            <defs>
              <filter id="neonGlow">
                <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                <feMerge>
                  <feMergeNode in="coloredBlur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>
            <circle cx="50" cy="50" r="45" fill="none" stroke="#FF00FF" stroke-width="2" filter="url(#neonGlow)"/>
            <circle cx="50" cy="50" r="40" fill="none" stroke="#6B2C91" stroke-width="1"/>
            <text x="50" y="30" text-anchor="middle" fill="#FF00FF" font-size="14" font-family="serif" font-weight="bold" filter="url(#neonGlow)">KURCED</text>
            <path d="M50 40 C40 50, 40 60, 50 70 C60 60, 60 50, 50 40" fill="none" stroke="#6B2C91" stroke-width="2"/>
            <path d="M50 70 L50 80" stroke="#6B2C91" stroke-width="2"/>
            <text x="50" y="92" text-anchor="middle" fill="#FF00FF" font-size="6" font-family="sans-serif" letter-spacing="1">PROTÉGÉ</text>
          </svg>
        </div>
        <div class="logo-text">KURCED</div>
      </div>
      <nav class="nav">
        <a href="#shop">Shop</a>
        <a href="#about">About</a>
        <a href="#pillars">Pillars</a>
        <a href="#contact">Contact</a>
      </nav>
      <a href="#cart" class="cart-btn">CART (0)</a>
    </div>
  </header>

  <section class="hero">
    <div class="hero-crest">
      <!-- Full Kurced Crest -->
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="neonGlowLarge">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
              <feMergeNode in="coloredBlur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
          <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#9B59B6"/>
            <stop offset="50%" style="stop-color:#6B2C91"/>
            <stop offset="100%" style="stop-color:#4A1A6B"/>
          </linearGradient>
        </defs>
        
        <!-- Outer neon ring -->
        <circle cx="100" cy="100" r="95" fill="none" stroke="#FF00FF" stroke-width="3" filter="url(#neonGlowLarge)"/>
        <circle cx="100" cy="100" r="88" fill="none" stroke="#6B2C91" stroke-width="1"/>
        
        <!-- Inner glow ring -->
        <circle cx="100" cy="100" r="85" fill="none" stroke="#FF00FF" stroke-width="0.5" opacity="0.5"/>
        
        <!-- KURCED text -->
        <text x="100" y="45" text-anchor="middle" fill="#FF00FF" font-size="24" font-family="serif" font-weight="bold" letter-spacing="4" filter="url(#neonGlowLarge)">KURCED</text>
        
        <!-- Rose with cross stem -->
        <path d="M100 60 C75 80, 75 110, 100 130 C125 110, 125 80, 100 60" fill="none" stroke="url(#purpleGrad)" stroke-width="3"/>
        <path d="M100 130 L100 155" stroke="#6B2C91" stroke-width="3"/>
        <path d="M100 150 L85 140" stroke="#6B2C91" stroke-width="2"/>
        <path d="M100 153 L115 143" stroke="#6B2C91" stroke-width="2"/>
        
        <!-- Cross at bottom -->
        <path d="M100 155 L100 165 M92 160 L108 160" stroke="#FF00FF" stroke-width="2" filter="url(#neonGlowLarge)"/>
        
        <!-- PROTÉGÉ text -->
        <text x="100" y="182" text-anchor="middle" fill="#FF00FF" font-size="10" font-family="sans-serif" letter-spacing="3" filter="url(#neonGlowLarge)">PROTÉGÉ</text>
        
        <!-- Electric accents -->
        <path d="M30 100 L40 100" stroke="#FF00FF" stroke-width="1" opacity="0.6"/>
        <path d="M160 100 L170 100" stroke="#FF00FF" stroke-width="1" opacity="0.6"/>
      </svg>
    </div>
    <h1>KURCED</h1>
    <p class="hero-tagline">Neon gothic. Digital darkness. Fall louder. Rise darker.</p>
    
    <div class="pillars">
      <div class="pillar">
        <div class="pillar-text">FALL LOUDER</div>
      </div>
      <div class="pillar">
        <div class="pillar-text">RISE DARKER</div>
      </div>
      <div class="pillar">
        <div class="pillar-text">LIVE CURSED</div>
      </div>
      <div class="pillar">
        <div class="pillar-text">LOVE DEEPER</div>
      </div>
      <div class="pillar">
        <div class="pillar-text">LEAVE A MARK</div>
      </div>
    </div>
    
    <a href="#shop" class="cta-btn">ENTER THE DARKNESS</a>
  </section>

  <section class="products" id="shop">
    <div class="section-header">
      <h2>The Collection</h2>
      <p>Neon gothic streetwear for the cursed souls.</p>
    </div>
    
    <div class="product-grid" id="productGrid">
      <!-- Products loaded dynamically -->
    </div>
  </section>

  <script src="../../admin/data/merch-database-v2.js"></script>
  <script src="../../admin/data/expanded-products.js"></script>
  <script>
    const products = EXPANDED_PRODUCTS['kurced'] || BRAND_PRODUCT_LINES['kurced'];
    const grid = document.getElementById('productGrid');
    
    grid.innerHTML = products.slice(0, 6).map(product => `
      <div class="product-card">
        <div class="product-image">
          <svg viewBox="0 0 200 200" style="max-width: 80%; max-height: 80%;">
            <defs>
              <filter id="neonGlow">
                <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                <feMerge>
                  <feMergeNode in="coloredBlur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>
            <circle cx="100" cy="100" r="90" fill="none" stroke="#FF00FF" stroke-width="2" filter="url(#neonGlow)"/>
            <text x="100" y="45" text-anchor="middle" fill="#FF00FF" font-size="20" font-family="serif" font-weight="bold" filter="url(#neonGlow)">KURCED</text>
            <path d="M100 70 C80 85, 80 110, 100 125 C120 110, 120 85, 100 70" fill="none" stroke="#6B2C91" stroke-width="3"/>
            <text x="100" y="155" text-anchor="middle" fill="#FF00FF" font-size="10" font-family="sans-serif" letter-spacing="2">PROTÉGÉ</text>
          </svg>
        </div>
        <div class="product-info" style="padding: 1.5rem;">
          <h3 style="font-family: Cinzel, serif; font-size: 1.1rem; margin-bottom: 0.5rem; letter-spacing: 1px;">${product.name}</h3>
          <p style="font-size: 0.8rem; color: rgba(255,255,255,0.5); margin-bottom: 1rem;">${product.design}</p>
          <div class="product-price">$${product.price.toFixed(2)}</div>
          <button class="add-to-cart" onclick="addToCart('${product.id}')">ADD TO CART</button>
        </div>
      </div>
    `).join('');
    
    function addToCart(productId) {
      alert(`Added ${productId} to cart!`);
    }
  </script>
</body>
</html>
