<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Endof8 | Official Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #D2691E;
      --orange-light: #E8833A;
      --sand: #C2B280;
      --black: #0A0A0A;
      --white: #FFFFFF;
      --navy: #1A1A3E;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: var(--black);
      color: var(--white);
      line-height: 1.6;
    }
    
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: rgba(10,10,10,0.98);
      backdrop-filter: blur(20px);
      z-index: 1000;
      border-bottom: 1px solid rgba(210,105,30,0.2);
    }
    
    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    
    .logo-circle {
      width: 50px;
      height: 50px;
      border: 2px dashed var(--orange);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .logo-text {
      font-family: 'Oswald', sans-serif;
      font-size: 1.75rem;
      font-weight: 600;
      color: var(--white);
      letter-spacing: 1px;
    }
    
    .nav {
      display: flex;
      gap: 2.5rem;
    }
    
    .nav a {
      color: var(--white);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 400;
      letter-spacing: 2px;
      transition: color 0.3s;
    }
    
    .nav a:hover { color: var(--orange); }
    
    .cart-btn {
      background: var(--orange);
      border: none;
      color: var(--white);
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 2px;
      transition: all 0.3s;
    }
    
    .cart-btn:hover {
      background: var(--orange-light);
    }
    
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8rem 2rem 4rem;
      background: linear-gradient(180deg, var(--black) 0%, #0a0a1a 50%, var(--black) 100%);
      position: relative;
    }
    
    .hero-logo {
      width: 280px;
      height: 280px;
      margin-bottom: 2rem;
    }
    
    .hero h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 4rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
      color: var(--white);
    }
    
    .hero h1 span {
      color: var(--orange);
    }
    
    .hero-tagline {
      font-size: 1rem;
      color: rgba(255,255,255,0.7);
      margin-bottom: 3rem;
      max-width: 500px;
      letter-spacing: 1px;
    }
    
    .pillars {
      display: flex;
      justify-content: center;
      gap: 3rem;
      margin-bottom: 4rem;
    }
    
    .pillar {
      text-align: center;
      padding: 1rem;
    }
    
    .pillar-text {
      font-family: 'Oswald', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 3px;
      color: var(--orange);
      font-weight: 500;
    }
    
    .cta-btn {
      display: inline-block;
      background: var(--orange);
      color: var(--white);
      padding: 1.25rem 3rem;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 3px;
      text-decoration: none;
      border-radius: 4px;
      transition: all 0.3s;
      font-family: 'Oswald', sans-serif;
    }
    
    .cta-btn:hover {
      background: var(--orange-light);
    }
    
    .products {
      padding: 6rem 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    
    .section-header {
      text-align: center;
      margin-bottom: 4rem;
    }
    
    .section-header h2 {
      font-family: 'Oswald', sans-serif;
      font-size: 3rem;
      color: var(--orange);
      margin-bottom: 1rem;
      letter-spacing: 3px;
    }
    
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2.5rem;
    }
    
    .product-card {
      background: #0f0f1a;
      border: 1px solid rgba(210,105,30,0.2);
      border-radius: 8px;
      overflow: hidden;
      transition: all 0.3s;
    }
    
    .product-card:hover {
      border-color: var(--orange);
    }
    
    .product-image {
      aspect-ratio: 1;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .product-price {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--orange);
      margin-bottom: 1rem;
    }
    
    .add-to-cart {
      width: 100%;
      background: var(--orange);
      color: var(--white);
      border: none;
      padding: 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 2px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.3s;
      font-family: 'Oswald', sans-serif;
    }
    
    .add-to-cart:hover {
      background: var(--orange-light);
    }
    
    @media (max-width: 768px) {
      .hero h1 { font-size: 3rem; }
      .hero-logo { width: 220px; height: 220px; }
      .pillars { flex-direction: column; gap: 1rem; }
      .nav { display: none; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-content">
      <div class="logo">
        <div class="logo-circle">
          <svg viewBox="0 0 100 100" width="40" height="40">
            <circle cx="50" cy="50" r="40" fill="none" stroke="#D2691E" stroke-width="2" stroke-dasharray="10,5"/>
            <text x="50" y="40" text-anchor="middle" fill="#D2691E" font-size="20" font-family="Oswald" font-weight="bold">End</text>
            <text x="50" y="65" text-anchor="middle" fill="#D2691E" font-size="28" font-family="Oswald" font-weight="bold">of</text>
            <text x="50" y="85" text-anchor="middle" fill="#D2691E" font-size="28" font-family="Oswald" font-weight="bold">8</text>
          </svg>
        </div>
        <div class="logo-text">ENDOF8</div>
      </div>
      <nav class="nav">
        <a href="#shop">Shop</a>
        <a href="#about">About</a>
        <a href="#pillars">Pillars</a>
        <a href="#contact">Contact</a>
      </nav>
      <a href="#cart" class="cart-btn">CART (0)</a>
    </div>
  </header>

  <section class="hero">
    <div class="hero-logo">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="100" r="90" fill="none" stroke="#D2691E" stroke-width="3" stroke-dasharray="15,8"/>
        <text x="100" y="60" text-anchor="middle" fill="#FFFFFF" font-size="24" font-family="Oswald" font-weight="500">End of</text>
        <text x="100" y="115" text-anchor="middle" fill="#D2691E" font-size="72" font-family="Oswald" font-weight="700">8</text>
        <text x="100" y="155" text-anchor="middle" fill="#C2B280" font-size="12" font-family="Inter" letter-spacing="3">OCEAN BEACH, CA</text>
        <path d="M160 70 Q170 65 175 70 Q180 75 170 80" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
      </svg>
    </div>
    <h1>ENDOF<span>8</span></h1>
    <p class="hero-tagline">Live Free. Ride Hard. Ocean Beach forever.</p>
    
    <div class="pillars">
      <div class="pillar">
        <div class="pillar-text">LIVE FREE</div>
      </div>
      <div class="pillar">
        <div class="pillar-text">RIDE HARD</div>
      </div>
      <div class="pillar">
        <div class="pillar-text">END OF 8</div>
      </div>
    </div>
    
    <a href="#shop" class="cta-btn">REP THE COAST</a>
  </section>

  <section class="products" id="shop">
    <div class="section-header">
      <h2>THE COLLECTION</h2>
      <p>Coastal streetwear for Ocean Beach locals.</p>
    </div>
    
    <div class="product-grid" id="productGrid"></div>
  </section>

  <script src="../../admin/data/merch-database-v2.js"></script>
  <script src="../../admin/data/expanded-products.js"></script>
  <script>
    const products = EXPANDED_PRODUCTS['endof8'] || BRAND_PRODUCT_LINES['endof8'];
    const grid = document.getElementById('productGrid');
    
    grid.innerHTML = products.slice(0, 6).map(product => `
      <div class="product-card">
        <div class="product-image">
          <svg viewBox="0 0 200 200" style="max-width: 80%; max-height: 80%;">
            <circle cx="100" cy="100" r="85" fill="none" stroke="#D2691E" stroke-width="2" stroke-dasharray="12,6"/>
            <text x="100" y="70" text-anchor="middle" fill="#FFFFFF" font-size="18" font-family="Oswald">End of</text>
            <text x="100" y="115" text-anchor="middle" fill="#D2691E" font-size="50" font-family="Oswald" font-weight="bold">8</text>
          </svg>
        </div>
        <div class="product-info" style="padding: 1.5rem;">
          <h3 style="font-family: Oswald, sans-serif; font-size: 1.3rem; margin-bottom: 0.5rem;">${product.name}</h3>
          <p style="font-size: 0.8rem; color: rgba(255,255,255,0.5); margin-bottom: 1rem;">${product.design}</p>
          <div class="product-price">$${product.price.toFixed(2)}</div>
          <button class="add-to-cart" onclick="addToCart('${product.id}')">ADD TO CART</button>
        </div>
      </div>
    `).join('');
    
    function addToCart(productId) {
      alert(`Added ${productId} to cart!`);
    }
  </script>
</body>
</html>
