<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wicked Youth | Official Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple: #8B5CF6;
      --purple-light: #A78BFA;
      --black: #0A0A0A;
      --white: #FFFFFF;
      --grey: #1A1A1A;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: var(--black);
      color: var(--white);
      line-height: 1.6;
    }
    
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: rgba(10,10,10,0.98);
      backdrop-filter: blur(20px);
      z-index: 1000;
      border-bottom: 1px solid rgba(139,92,246,0.2);
    }
    
    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    
    .logo-crown {
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .logo-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      font-weight: 400;
      color: var(--white);
      letter-spacing: 2px;
    }
    
    .nav {
      display: flex;
      gap: 2.5rem;
    }
    
    .nav a {
      color: var(--white);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 400;
      letter-spacing: 2px;
      transition: color 0.3s;
    }
    
    .nav a:hover { color: var(--purple); }
    
    .cart-btn {
      background: var(--purple);
      border: none;
      color: var(--white);
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 2px;
      transition: all 0.3s;
    }
    
    .cart-btn:hover {
      background: var(--purple-light);
    }
    
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8rem 2rem 4rem;
      background: linear-gradient(180deg, var(--black) 0%, #0f0f0f 50%, var(--black) 100%);
      position: relative;
    }
    
    .hero-crown {
      width: 200px;
      height: 200px;
      margin-bottom: 2rem;
    }
    
    .hero h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 5rem;
      font-weight: 400;
      letter-spacing: 4px;
      margin-bottom: 0.5rem;
      color: var(--white);
      line-height: 1;
    }
    
    .hero-subtitle {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      color: var(--purple);
      letter-spacing: 8px;
      margin-bottom: 2rem;
    }
    
    .hero-tagline {
      font-size: 1rem;
      color: rgba(255,255,255,0.7);
      margin-bottom: 3rem;
      max-width: 500px;
      letter-spacing: 1px;
    }
    
    .pillars {
      display: flex;
      justify-content: center;
      gap: 3rem;
      margin-bottom: 4rem;
    }
    
    .pillar {
      text-align: center;
      padding: 1rem;
      border: 2px solid var(--purple);
      border-radius: 4px;
    }
    
    .pillar-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem;
      letter-spacing: 4px;
      color: var(--purple);
    }
    
    .cta-btn {
      display: inline-block;
      background: var(--purple);
      color: var(--white);
      padding: 1.25rem 3rem;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 3px;
      text-decoration: none;
      border-radius: 4px;
      transition: all 0.3s;
      font-family: 'Bebas Neue', sans-serif;
    }
    
    .cta-btn:hover {
      background: var(--purple-light);
      transform: translateY(-2px);
    }
    
    .products {
      padding: 6rem 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    
    .section-header {
      text-align: center;
      margin-bottom: 4rem;
    }
    
    .section-header h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3rem;
      color: var(--white);
      margin-bottom: 1rem;
      letter-spacing: 4px;
    }
    
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2.5rem;
    }
    
    .product-card {
      background: var(--grey);
      border: 2px solid transparent;
      border-radius: 4px;
      overflow: hidden;
      transition: all 0.3s;
    }
    
    .product-card:hover {
      border-color: var(--purple);
    }
    
    .product-image {
      aspect-ratio: 1;
      background: #0f0f0f;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .product-price {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--purple);
      margin-bottom: 1rem;
    }
    
    .add-to-cart {
      width: 100%;
      background: var(--purple);
      color: var(--white);
      border: none;
      padding: 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 2px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.3s;
      font-family: 'Bebas Neue', sans-serif;
    }
    
    .add-to-cart:hover {
      background: var(--purple-light);
    }
    
    @media (max-width: 768px) {
      .hero h1 { font-size: 3.5rem; }
      .hero-crown { width: 150px; height: 150px; }
      .pillars { flex-direction: column; gap: 1rem; }
      .nav { display: none; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-content">
      <div class="logo">
        <div class="logo-crown">
          <svg viewBox="0 0 100 100" width="50" height="50">
            <path d="M50 20 L60 40 L80 35 L70 55 L90 60 L50 75 L10 60 L30 55 L20 35 L40 40 Z" fill="none" stroke="#8B5CF6" stroke-width="3"/>
            <circle cx="50" cy="50" r="8" fill="#8B5CF6"/>
          </svg>
        </div>
        <div class="logo-text">WICKED YOUTH</div>
      </div>
      <nav class="nav">
        <a href="#shop">Shop</a>
        <a href="#about">About</a>
        <a href="#pillars">Pillars</a>
        <a href="#contact">Contact</a>
      </nav>
      <a href="#cart" class="cart-btn">CART (0)</a>
    </div>
  </header>

  <section class="hero">
    <div class="hero-crown">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <path d="M100 40 L120 80 L160 70 L140 110 L180 120 L100 150 L20 120 L60 110 L40 70 L80 80 Z" fill="none" stroke="#8B5CF6" stroke-width="4"/>
        <circle cx="100" cy="100" r="15" fill="#8B5CF6"/>
        <text x="100" y="175" text-anchor="middle" fill="#8B5CF6" font-size="14" font-family="Bebas Neue" letter-spacing="4">WICKED YOUTH</text>
      </svg>
    </div>
    <h1>WICKED YOUTH</h1>
    <div class="hero-subtitle">CREATE • DISRUPT • ELEVATE</div>
    <p class="hero-tagline">Built by the wicked. For the awakened.</p>
    
    <div class="pillars">
      <div class="pillar">
        <div class="pillar-text">CREATE</div>
      </div>
      <div class="pillar">
        <div class="pillar-text">DISRUPT</div>
      </div>
      <div class="pillar">
        <div class="pillar-text">ELEVATE</div>
      </div>
    </div>
    
    <a href="#shop" class="cta-btn">CLAIM YOUR CROWN</a>
  </section>

  <section class="products" id="shop">
    <div class="section-header">
      <h2>THE COLLECTION</h2>
      <p>Street royalty for the next generation.</p>
    </div>
    
    <div class="product-grid" id="productGrid"></div>
  </section>

  <script src="../../admin/data/merch-database-v2.js"></script>
  <script src="../../admin/data/expanded-products.js"></script>
  <script>
    const products = EXPANDED_PRODUCTS['wickedyouth'] || BRAND_PRODUCT_LINES['wickedyouth'];
    const grid = document.getElementById('productGrid');
    
    grid.innerHTML = products.slice(0, 6).map(product => `
      <div class="product-card">
        <div class="product-image">
          <svg viewBox="0 0 200 200" style="max-width: 80%; max-height: 80%;">
            <path d="M100 50 L115 75 L140 70 L125 95 L150 100 L100 120 L50 100 L75 95 L60 70 L85 75 Z" fill="none" stroke="#8B5CF6" stroke-width="3"/>
            <circle cx="100" cy="95" r="10" fill="#8B5CF6"/>
          </svg>
        </div>
        <div class="product-info" style="padding: 1.5rem;">
          <h3 style="font-family: Bebas Neue, sans-serif; font-size: 1.3rem; margin-bottom: 0.5rem;">${product.name}</h3>
          <p style="font-size: 0.8rem; color: rgba(255,255,255,0.5); margin-bottom: 1rem;">${product.design}</p>
          <div class="product-price">$${product.price.toFixed(2)}</div>
          <button class="add-to-cart" onclick="addToCart('${product.id}')">ADD TO CART</button>
        </div>
      </div>
    `).join('');
    
    function addToCart(productId) {
      alert(`Added ${productId} to cart!`);
    }
  </script>
</body>
</html>
