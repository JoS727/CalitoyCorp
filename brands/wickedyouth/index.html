<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wicked Youth | Official Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas Neue:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #000000;
      --accent: #8B5CF6;
      --black: #0A0A0A;
      --white: #FFFFFF;
      --grey: #1A1A1A;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: var(--black);
      color: var(--white);
      line-height: 1.6;
    }
    
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: rgba(10,10,10,0.95);
      backdrop-filter: blur(10px);
      z-index: 1000;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    
    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
    }
    
    .logo-icon { font-size: 2rem; }
    
    .nav {
      display: flex;
      gap: 2rem;
    }
    
    .nav a {
      color: var(--white);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.3s;
    }
    
    .nav a:hover { color: var(--accent); }
    
    .cart-btn {
      background: var(--accent);
      color: var(--black);
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 600;
    }
    
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--black) 0%, var(--primary) 100%);
      position: relative;
      overflow: hidden;
    }
    
    .hero::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 800px; height: 800px;
      background: radial-gradient(circle, rgba(139,92,246,0.2) 0%, transparent 70%);
      pointer-events: none;
    }
    
    .hero-content {
      text-align: center;
      max-width: 800px;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }
    
    .hero-icon {
      font-size: 6rem;
      margin-bottom: 1rem;
      text-shadow: 0 0 50px var(--accent);
    }
    
    .hero h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 4rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: var(--accent);
      text-shadow: 0 0 30px rgba(139,92,246,0.5);
    }
    
    .hero-tagline {
      font-size: 1.1rem;
      color: rgba(255,255,255,0.8);
      margin-bottom: 2rem;
    }
    
    .pillars {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 3rem;
      flex-wrap: wrap;
    }
    
    .pillar {
      text-align: center;
      padding: 1rem;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      border: 1px solid rgba(139,92,246,0.3);
    }
    
    .pillar-text {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent);
      font-weight: 600;
    }
    
    .cta-btn {
      display: inline-block;
      background: var(--accent);
      color: var(--black);
      padding: 1rem 3rem;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      border-radius: 4px;
      transition: all 0.3s;
    }
    
    .cta-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(139,92,246,0.4);
    }
    
    .products {
      padding: 6rem 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    
    .section-header {
      text-align: center;
      margin-bottom: 4rem;
    }
    
    .section-header h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3rem;
      color: var(--accent);
      margin-bottom: 1rem;
    }
    
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 2rem;
    }
    
    .product-card {
      background: var(--grey);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      overflow: hidden;
      transition: all 0.3s;
    }
    
    .product-card:hover {
      border-color: var(--accent);
      transform: translateY(-5px);
    }
    
    .product-image {
      aspect-ratio: 1;
      background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
    }
    
    .product-info {
      padding: 1.5rem;
    }
    
    .product-name {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    
    .product-price {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 1rem;
    }
    
    .add-to-cart {
      width: 100%;
      background: var(--accent);
      color: var(--black);
      border: none;
      padding: 1rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 4px;
    }
    
    .footer {
      background: var(--black);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 4rem 2rem 2rem;
      text-align: center;
    }
    
    .social-links {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 2rem;
    }
    
    .social-links a {
      color: var(--white);
      text-decoration: none;
      font-size: 1.25rem;
    }
    
    .social-links a:hover { color: var(--accent); }
    
    @media (max-width: 768px) {
      .hero h1 { font-size: 2.5rem; }
      .pillars { flex-direction: column; }
      .nav { display: none; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-content">
      <div class="logo">
        <span class="logo-icon">👑</span>
        <span>Wicked Youth</span>
      </div>
      <nav class="nav">
        <a href="#shop">Shop</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
      <a href="#cart" class="cart-btn">Cart (0)</a>
    </div>
  </header>

  <section class="hero">
    <div class="hero-content">
      <div class="hero-icon">👑</div>
      <h1>Wicked Youth</h1>
      <p class="hero-tagline">Create. Disrupt. Elevate. Built By The Wicked. For The Awakened.</p>
      
      <div class="pillars">
        <div class="pillar"><div class="pillar-text">CREATE</div></div>
<div class="pillar"><div class="pillar-text">DISRUPT</div></div>
<div class="pillar"><div class="pillar-text">ELEVATE</div></div>
      </div>
      
      <a href="#shop" class="cta-btn">Shop Collection</a>
    </div>
  </section>

  <section class="products" id="shop">
    <div class="section-header">
      <h2>The Collection</h2>
    </div>
    <div class="product-grid" id="productGrid"></div>
  </section>

  <footer class="footer">
    <div class="social-links">
      <a href="https://instagram.com/wickedyth">📷 Instagram</a>
      <a href="https://tiktok.com/wickedyth">🎵 TikTok</a>
      <a href="https://wickedyth.com">🌐 Website</a>
    </div>
    <p style="color: rgba(255,255,255,0.4);">© 2026 Wicked Youth. A CalitoyCorp Brand.</p>
  </footer>

  <script src="../../admin/data/merch-database-v2.js"></script>
  <script>
    const products = BRAND_PRODUCT_LINES['wickedyouth'];
    const grid = document.getElementById('productGrid');
    
    grid.innerHTML = products.map(p => `
      <div class="product-card">
        <div class="product-image">👑</div>
        <div class="product-info">
          <h3 class="product-name">${p.name}</h3>
          <div class="product-price">$${p.price.toFixed(2)}</div>
          <button class="add-to-cart" onclick="addToCart('${p.id}')">Add to Cart</button>
        </div>
      </div>
    `).join('');
    
    function addToCart(id) {
      alert('Added to cart! Checkout with Stripe coming soon.');
    }
  </script>
</body>
</html>
