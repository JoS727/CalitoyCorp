name: Refresh private admin launchpad inventory
on:
  workflow_dispatch:
  schedule:
    # 8 AM Los Angeles: one of these UTC hours matches across DST changes.
    - cron: '0 15,16 * * *'
permissions:
  contents: write
concurrency:
  group: private-admin-inventory
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || github.repository == 'JoS727/CalitoyCorp'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure scheduled run is 8 AM Pacific
        if: github.event_name == 'schedule'
        env:
          TZ: America/Los_Angeles
        run: |
          if [ "$(TZ=America/Los_Angeles date +%H)" != "08" ]; then
            echo "Not 8 AM Pacific: skip outside daylight saving offset."
            echo "SKIP_REFRESH=1" >> "$GITHUB_ENV"
          fi
      - name: Refresh private repository inventory
        if: env.SKIP_REFRESH != '1'
        env:
          INVENTORY_GITHUB_TOKEN: ${{ secrets.INVENTORY_GITHUB_TOKEN }}
          INVENTORY_OWNER: JoS727
        run: |
          if [ -z "$INVENTORY_GITHUB_TOKEN" ]; then
            echo "::error::INVENTORY_GITHUB_TOKEN is required (fine-grained, read-only metadata for all target repositories)"
            exit 1
          fi
          python3 admin-launchpad/refresh.py
      - name: Commit updated inventory
        if: env.SKIP_REFRESH != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-launchpad/inventory.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh private admin launchpad inventory"
            git push
          fi
