name: Admin inventory refresh - private storage setup required
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-storage-required:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to publish private repository metadata
        run: |
          echo '::error::Refresh is paused until authenticated private storage is connected. Never commit private repository inventory to this public repository or upload it as a public workflow artifact.'
          exit 1
