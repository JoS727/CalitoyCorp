name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: |
        npm install -g html-minifier
        
    - name: Build
      run: |
        echo "Building CalitoyCorp..."
        # Minify HTML files for faster loading
        find . -name "*.html" -not -path "./node_modules/*" -exec html-minifier --collapse-whitespace --remove-comments --minify-css --minify-js -o {} {} \;
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        
    - name: Verify deployment
      run: |
        echo "Deployment complete!"
        echo "Site URL: https://jos727.github.io/CalitoyCorp/"
