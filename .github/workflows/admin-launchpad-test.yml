name: Test private admin boundary
on:
  pull_request:
    paths: ['admin-launchpad/**', '.github/workflows/admin-launchpad-*.yml']
  push:
    branches: [main]
    paths: ['admin-launchpad/**', '.github/workflows/admin-launchpad-*.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test admin-launchpad/tests/core.test.mjs
      - run: python3 -m unittest discover -s admin-launchpad/tests -p 'test_*.py'
      - name: Ensure no public inventory is tracked
        run: test -z "$(git ls-files 'admin-launchpad/inventory*.json')"
